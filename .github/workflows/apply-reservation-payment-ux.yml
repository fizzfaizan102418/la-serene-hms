name: Apply reservation and payment UX fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update reservation guest selector and payment inputs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          reservation_path = Path('apps/web/src/ReservationsPMSView.tsx')
          text = reservation_path.read_text(encoding='utf-8')

          marker = "const HIDDEN_RESERVATION_STATUSES = new Set(['checked_out', 'cancelled', 'no_show']);\n"
          component = r'''

type GuestSearchProps = {
  guests: Guest[];
  value: string;
  onChange: (value: string) => void;
  api: <T>(path: string, options?: RequestInit) => Promise<T>;
  placeholder?: string;
};

function GuestSearch({ guests, value, onChange, api, placeholder = 'Search guest name or phone' }: GuestSearchProps) {
  const [query, setQuery] = useState('');
  const [matches, setMatches] = useState<Guest[]>([]);
  const [selectedLabel, setSelectedLabel] = useState('');

  useEffect(() => {
    if (!value) {
      setSelectedLabel('');
      return;
    }
    const selected = guests.find(guest => String(guest.id) === value);
    if (selected) setSelectedLabel(`${selected.full_name}${selected.phone ? ` · ${selected.phone}` : ''}`);
  }, [value, guests]);

  useEffect(() => {
    const needle = query.trim();
    if (value || needle.length < 2) {
      setMatches([]);
      return;
    }
    const timer = window.setTimeout(() => {
      api<Guest[]>(`/api/guests?q=${encodeURIComponent(needle)}`)
        .then(result => setMatches(result.slice(0, 20)))
        .catch(() => setMatches([]));
    }, 250);
    return () => window.clearTimeout(timer);
  }, [api, query, value]);

  function choose(guest: Guest) {
    onChange(String(guest.id));
    setSelectedLabel(`${guest.full_name}${guest.phone ? ` · ${guest.phone}` : ''}`);
    setQuery('');
    setMatches([]);
  }

  function clear() {
    onChange('');
    setSelectedLabel('');
    setQuery('');
    setMatches([]);
  }

  if (value) {
    return <div style={{ border: '1px solid #dedbd2', padding: 10, borderRadius: 10, display: 'flex', justifyContent: 'space-between', gap: 10, alignItems: 'center', background: '#fbfaf7' }}>
      <span><strong>{selectedLabel || `Guest #${value}`}</strong></span>
      <button type="button" className="link-button" onClick={clear}>Change</button>
    </div>;
  }

  return <div style={{ position: 'relative' }}>
    <input value={query} onChange={event => setQuery(event.target.value)} placeholder={placeholder} autoComplete="off" aria-label={placeholder} />
    {query.trim().length >= 2 && <div className="reservation-list" style={{ marginTop: 8 }}>
      {matches.length ? matches.map(guest => <article key={guest.id}>
        <div><strong>{guest.full_name}</strong><span>{guest.phone || guest.email || 'No contact details'}</span></div>
        <button type="button" className="secondary-button small-button" onClick={() => choose(guest)}>Select</button>
      </article>) : <p className="muted" style={{ margin: 8 }}>No matching guest found.</p>}
    </div>}
  </div>;
}
'''
          if component.strip() not in text:
              if marker not in text:
                  raise SystemExit('Reservation status marker not found')
              text = text.replace(marker, marker + component, 1)

          old_booking = '<label>Booking guest<select value={bookingGuest} onChange={e => { setBookingGuest(e.target.value); setAllocations(current => current.map(a => ({ ...a, occupantId: a.occupantId || e.target.value }))); }} required><option value="">Select guest</option>{guests.map(g => <option key={g.id} value={g.id}>{g.full_name}{g.phone ? ` · ${g.phone}` : \'\'}</option>)}</select></label>'
          new_booking = '<label>Booking guest<GuestSearch guests={guests} value={bookingGuest} onChange={value => { setBookingGuest(value); setAllocations(current => current.map(a => ({ ...a, occupantId: a.occupantId || value }))); }} api={api} placeholder="Search guest name or phone" /></label>'
          if old_booking not in text:
              raise SystemExit('Booking guest selector not found')
          text = text.replace(old_booking, new_booking, 1)

          old_occupant = '<label>Occupant<select value={a.occupantId} onChange={e => updateAllocation(a.roomId, { occupantId: e.target.value })}><option value="">Select occupant</option>{guests.map(g => <option key={g.id} value={g.id}>{g.full_name}</option>)}</select></label>'
          new_occupant = '<label>Occupant<GuestSearch guests={guests} value={a.occupantId} onChange={value => updateAllocation(a.roomId, { occupantId: value })} api={api} placeholder="Search occupant name or phone" /></label>'
          if old_occupant not in text:
              raise SystemExit('Allocation occupant selector not found')
          text = text.replace(old_occupant, new_occupant, 1)

          old_split = '<label>New reservation guest<select value={splitGuest} onChange={e => setSplitGuest(e.target.value)}><option value="">Same booking guest</option>{guests.map(g => <option key={g.id} value={g.id}>{g.full_name}</option>)}</select></label>'
          new_split = '<label>New reservation guest<GuestSearch guests={guests} value={splitGuest} onChange={setSplitGuest} api={api} placeholder="Search guest name or phone" /></label>'
          if old_split not in text:
              raise SystemExit('Split guest selector not found')
          text = text.replace(old_split, new_split, 1)

          reservation_path.write_text(text, encoding='utf-8')

          main_path = Path('apps/web/src/main.tsx')
          main = main_path.read_text(encoding='utf-8')
          role_effect = """  useEffect(() => {\n    if (!visibleModules.includes(view)) setView('Dashboard');\n  }, [user?.role]);\n"""
          wheel_effect = """  useEffect(() => {\n    const stopNumberWheelChange = (event: WheelEvent) => {\n      const target = event.target;\n      if (target instanceof HTMLInputElement && target.type === 'number' && document.activeElement === target) {\n        event.preventDefault();\n      }\n    };\n    document.addEventListener('wheel', stopNumberWheelChange, { passive: false });\n    return () => document.removeEventListener('wheel', stopNumberWheelChange);\n  }, []);\n\n"""
          if wheel_effect.strip() not in main:
              if role_effect not in main:
                  raise SystemExit('Main role effect not found')
              main = main.replace(role_effect, role_effect + '\n' + wheel_effect, 1)
          main_path.write_text(main, encoding='utf-8')

          styles_path = Path('apps/web/src/styles.css')
          styles = styles_path.read_text(encoding='utf-8')
          number_css = """

/* Money/rate/quantity inputs must not change accidentally from spinner clicks or mouse-wheel input. */
input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
"""
          if 'input[type="number"]::-webkit-inner-spin-button' not in styles:
              styles += number_css
          styles_path.write_text(styles, encoding='utf-8')

          workflow_path = Path('.github/workflows/apply-reservation-payment-ux.yml')
          workflow_path.unlink()
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/ReservationsPMSView.tsx apps/web/src/main.tsx apps/web/src/styles.css .github/workflows/apply-reservation-payment-ux.yml
          git diff --cached --quiet && exit 0
          git commit -m "Improve guest selection and payment input safety"
          git push origin main
