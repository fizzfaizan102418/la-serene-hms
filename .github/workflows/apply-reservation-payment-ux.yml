name: Apply reservation and payment UX fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source changes
        run: python scripts/apply_reservation_payment_ux.py
      - name: Commit changes and remove helper
        run: |
          rm scripts/apply_reservation_payment_ux.py
          rm .github/workflows/apply-reservation-payment-ux.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/ReservationsPMSView.tsx apps/web/src/main.tsx apps/web/src/styles.css scripts/apply_reservation_payment_ux.py .github/workflows/apply-reservation-payment-ux.yml
          git diff --cached --quiet && exit 0
          git commit -m "Improve guest selection and payment input safety"
          git push origin main
