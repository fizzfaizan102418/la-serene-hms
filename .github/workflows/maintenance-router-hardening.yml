name: Maintenance router hardening

on:
  push:
    branches:
      - phase-a-architecture-hardening

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove duplicate router registrations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/api/app/main.py")
          text = path.read_text(encoding="utf-8")
          replacements = [
              ('app.include_router(billing_router)\napp.include_router(housekeeping_router)\napp.include_router(pms_core_router)\napp.include_router(reservation_workflows_router)\napp.include_router(phase_a_workflows_router)',
               'app.include_router(billing_router)\napp.include_router(reservation_workflows_router)\napp.include_router(phase_a_workflows_router)'),
          ]
          original = text
          for old, new in replacements:
              if old not in text:
                  raise SystemExit("Expected router registration block was not found")
              text = text.replace(old, new, 1)
          if text == original:
              raise SystemExit("No changes were made")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Remove one-time maintenance workflow
        run: rm .github/workflows/maintenance-router-hardening.yml

      - name: Commit hardening change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/app/main.py .github/workflows/maintenance-router-hardening.yml
          git commit -m "fix: remove duplicate API router registrations"
          git push origin HEAD:phase-a-architecture-hardening
