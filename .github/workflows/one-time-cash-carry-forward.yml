name: One-time cash carry-forward patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply cash carry-forward patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/api/app/night_audit.py')
          text = path.read_text(encoding='utf-8')

          old = '''def build_pre_close_preview(db: Session, business_date: date, summary: dict) -> dict:\n    pending = preview_room_charges_for_business_date(db, business_date=business_date)\n    pending_total = money(sum((row["amount"] for row in pending), Decimal("0.00")))\n    opening_cash = ledger_account_delta(db, business_date, CASH_ACCOUNTS, True)\n'''
          new = '''def prior_closing_cash(db: Session, business_date: date) -> Decimal | None:\n    """Return the last closed day's physical cash for carry-forward.\n\n    The archived closing pack is the authoritative bridge for historical periods\n    that may not have a cash ledger opening transaction. Future closing packs\n    include the same projected closing cash, so each business day carries the\n    physical cash balance forward without creating synthetic revenue or expense.\n    """\n    state = db.get(BusinessDateState, 1)\n    prior_date = state.last_closed_business_date if state else None\n    if prior_date is None or prior_date >= business_date:\n        return None\n\n    path = PACK_ROOT / prior_date.isoformat() / "daily-closing.json"\n    if not path.exists():\n        return None\n    try:\n        payload = json.loads(path.read_text(encoding="utf-8"))\n        report = payload.get("report", {})\n        projected = report.get("pre_close", {}).get("projected_close", {}).get("cash")\n        if projected is not None:\n            return money(projected)\n        historical = report.get("historical_reconciliation", {}).get("closing_cash")\n        if historical is not None:\n            return money(historical)\n    except (OSError, ValueError, TypeError):\n        return None\n    return None\n\n\ndef build_pre_close_preview(db: Session, business_date: date, summary: dict) -> dict:\n    pending = preview_room_charges_for_business_date(db, business_date=business_date)\n    pending_total = money(sum((row["amount"] for row in pending), Decimal("0.00")))\n    opening_cash = prior_closing_cash(db, business_date)\n    if opening_cash is None:\n        opening_cash = ledger_account_delta(db, business_date, CASH_ACCOUNTS, True)\n'''
          if old not in text:
              raise SystemExit('Expected build_pre_close_preview cash block was not found')
          text = text.replace(old, new, 1)

          old = '''    summary = build_summary(db, business_date, finance)\n    summary["night_audit"] = {"room_charges_accrued": accrued_room_charges}\n    closed_at = datetime.utcnow()\n'''
          new = '''    summary = build_summary(db, business_date, finance)\n    summary["night_audit"] = {"room_charges_accrued": accrued_room_charges}\n    summary["pre_close"] = build_pre_close_preview(db, business_date, summary)\n    closed_at = datetime.utcnow()\n'''
          if old not in text:
              raise SystemExit('Expected close-day summary block was not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/app/night_audit.py .github/workflows/one-time-cash-carry-forward.yml
          git commit -m "Carry forward daily closing cash balance" || exit 0
          git rm .github/workflows/one-time-cash-carry-forward.yml
          git add apps/api/app/night_audit.py
          git commit --amend --no-edit
          git push origin HEAD:main
