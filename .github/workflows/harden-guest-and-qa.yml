name: Harden Guest Search And QA

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden-and-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply guest API hardening and QA coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path('apps/api/app/main.py')
          text = main.read_text(encoding='utf-8')

          old_guest_block = '''@app.get("/api/guests", response_model=list[GuestResponse])\ndef list_guests(q: str | None = Query(default=None, min_length=1, max_length=160), db: Session = Depends(get_db), _: User = Depends(get_current_user)):\n    stmt = select(Guest)\n    if q:\n        pattern = f"%{q.strip()}%"; stmt = stmt.where((Guest.full_name.ilike(pattern)) | (Guest.phone.ilike(pattern)) | (Guest.email.ilike(pattern)))\n    return db.scalars(stmt.order_by(Guest.full_name)).all()\n\n\n@app.post("/api/guests", response_model=GuestResponse, status_code=201)\ndef create_guest(payload: GuestCreate, db: Session = Depends(get_db), user: User = Depends(require_roles("admin", "reception"))):\n    guest = Guest(**payload.model_dump()); db.add(guest); db.flush()\n    write_audit(db, "create", "guest", guest.id, {"full_name": guest.full_name}, user.id)\n    db.commit(); db.refresh(guest); return guest\n\n\n@app.patch("/api/guests/{guest_id}", response_model=GuestResponse)\ndef update_guest(guest_id: int, payload: GuestCreate, db: Session = Depends(get_db), user: User = Depends(require_roles("admin", "reception"))):\n    guest = db.get(Guest, guest_id)\n    if not guest:\n        raise HTTPException(status_code=404, detail="Guest not found")\n    old = {\n        "full_name": guest.full_name,\n        "phone": guest.phone,\n        "email": guest.email,\n        "address": guest.address,\n        "id_document": guest.id_document,\n    }\n    values = payload.model_dump()\n    guest.full_name = values["full_name"]\n    guest.phone = values["phone"]\n    guest.email = values["email"]\n    guest.address = values["address"]\n    guest.id_document = values["id_document"]\n    write_audit(db, "update", "guest", guest.id, {"from": old, "to": values}, user.id)\n    db.commit(); db.refresh(guest); return guest\n'''

          new_guest_block = '''GUEST_SEARCH_DEFAULT_LIMIT = 20\nGUEST_SEARCH_MAX_LIMIT = 50\n\n\ndef _guest_identifier(value: str | None) -> str:\n    return (value or "").strip().lower()\n\n\ndef _guest_duplicate_matches(db: Session, payload: GuestCreate, exclude_guest_id: int | None = None) -> list[Guest]:\n    phone = _guest_identifier(payload.phone)\n    id_document = _guest_identifier(payload.id_document)\n    if not phone and not id_document:\n        return []\n\n    conditions = []\n    if phone:\n        conditions.append(func.lower(Guest.phone) == phone)\n    if id_document:\n        conditions.append(func.lower(Guest.id_document) == id_document)\n\n    stmt = select(Guest).where(conditions[0] if len(conditions) == 1 else conditions[0] | conditions[1]).order_by(Guest.full_name).limit(10)\n    if exclude_guest_id is not None:\n        stmt = stmt.where(Guest.id != exclude_guest_id)\n    return db.scalars(stmt).all()\n\n\ndef _raise_guest_duplicate_warning(matches: list[Guest]) -> None:\n    if not matches:\n        return\n    raise HTTPException(\n        status_code=409,\n        detail={\n            "message": "Possible duplicate guest record. Verify the guest before saving.",\n            "matches": [\n                {\n                    "id": guest.id,\n                    "full_name": guest.full_name,\n                    "phone": guest.phone,\n                    "id_document": guest.id_document,\n                }\n                for guest in matches\n            ],\n        },\n    )\n\n\n@app.get("/api/guests", response_model=list[GuestResponse])\ndef list_guests(\n    q: str | None = Query(default=None, min_length=1, max_length=160),\n    limit: int = Query(default=GUEST_SEARCH_DEFAULT_LIMIT, ge=1, le=GUEST_SEARCH_MAX_LIMIT),\n    db: Session = Depends(get_db),\n    _: User = Depends(get_current_user),\n):\n    stmt = select(Guest)\n    if q:\n        pattern = f"%{q.strip()}%"\n        stmt = stmt.where((Guest.full_name.ilike(pattern)) | (Guest.phone.ilike(pattern)) | (Guest.email.ilike(pattern)))\n    return db.scalars(stmt.order_by(Guest.full_name).limit(limit)).all()\n\n\n@app.get("/api/guests/duplicate-check", response_model=list[GuestResponse])\ndef guest_duplicate_check(\n    phone: str | None = Query(default=None, max_length=40),\n    id_document: str | None = Query(default=None, max_length=100),\n    exclude_guest_id: int | None = Query(default=None, ge=1),\n    db: Session = Depends(get_db),\n    _: User = Depends(get_current_user),\n):\n    payload = GuestCreate(full_name="Duplicate check", phone=phone, id_document=id_document)\n    return _guest_duplicate_matches(db, payload, exclude_guest_id=exclude_guest_id)\n\n\n@app.post("/api/guests", response_model=GuestResponse, status_code=201)\ndef create_guest(payload: GuestCreate, db: Session = Depends(get_db), user: User = Depends(require_roles("admin", "reception"))):\n    _raise_guest_duplicate_warning(_guest_duplicate_matches(db, payload))\n    guest = Guest(**payload.model_dump()); db.add(guest); db.flush()\n    write_audit(db, "create", "guest", guest.id, {"full_name": guest.full_name}, user.id)\n    db.commit(); db.refresh(guest); return guest\n\n\n@app.patch("/api/guests/{guest_id}", response_model=GuestResponse)\ndef update_guest(guest_id: int, payload: GuestCreate, db: Session = Depends(get_db), user: User = Depends(require_roles("admin", "reception"))):\n    guest = db.get(Guest, guest_id)\n    if not guest:\n        raise HTTPException(status_code=404, detail="Guest not found")\n    _raise_guest_duplicate_warning(_guest_duplicate_matches(db, payload, exclude_guest_id=guest_id))\n    old = {\n        "full_name": guest.full_name,\n        "phone": guest.phone,\n        "email": guest.email,\n        "address": guest.address,\n        "id_document": guest.id_document,\n    }\n    values = payload.model_dump()\n    guest.full_name = values["full_name"]\n    guest.phone = values["phone"]\n    guest.email = values["email"]\n    guest.address = values["address"]\n    guest.id_document = values["id_document"]\n    write_audit(db, "update", "guest", guest.id, {"from": old, "to": values}, user.id)\n    db.commit(); db.refresh(guest); return guest\n'''

          if old_guest_block not in text:
              raise SystemExit('Expected guest API block was not found; refusing to modify main.py')
          main.write_text(text.replace(old_guest_block, new_guest_block), encoding='utf-8')

          test = Path('apps/api/tests/test_guest_profile.py')
          test_text = test.read_text(encoding='utf-8')
          test_text = test_text.replace('from app.main import update_guest', 'from app.main import create_guest, list_guests, update_guest')
          insert = '''\n    def test_guest_search_is_limited_at_query_level(self):\n        self.db.add_all([\n            Guest(full_name=f"Search Guest {i:02d}", phone=f"03000000{i:03d}")\n            for i in range(25)\n        ])\n        self.db.commit()\n\n        results = list_guests("Search", 20, self.db, self.user)\n        self.assertEqual(len(results), 20)\n\n    def test_guest_create_rejects_duplicate_identity(self):\n        payload = GuestCreate(full_name="Duplicate Guest", phone="03000000000", id_document="NEW-ID")\n        with self.assertRaises(Exception) as context:\n            create_guest(payload, self.db, self.user)\n        self.assertEqual(getattr(context.exception, "status_code", None), 409)\n        detail = getattr(context.exception, "detail", {})\n        self.assertIn("Possible duplicate guest record", detail.get("message", ""))\n        self.assertEqual(detail.get("matches", [])[0]["id"], 1)\n\n    def test_guest_update_rejects_duplicate_identity(self):\n        self.db.add(Guest(id=2, full_name="Second Guest", phone="03222222222", id_document="SECOND-ID"))\n        self.db.commit()\n        payload = GuestCreate(full_name="Updated Guest", phone="03222222222", id_document="NEW-ID")\n        with self.assertRaises(Exception) as context:\n            update_guest(1, payload, self.db, self.user)\n        self.assertEqual(getattr(context.exception, "status_code", None), 409)\n'''
          marker = '    def test_guest_profile_update_rejects_unknown_guest(self):\n'
          if insert.strip() not in test_text:
              test_text = test_text.replace(marker, insert + '\n' + marker)
          test.write_text(test_text, encoding='utf-8')
          PY

      - name: Add production QA playbook
        shell: bash
        run: |
          cat > docs/PRODUCTION-QA-CHECKLIST.md <<'EOF'
          # La Serene HMS — Production End-to-End QA Checklist

          This checklist is for the hotel laptop at `D:\LaSereneHMS`. It is deliberately focused on real operational workflows rather than synthetic unit-only checks.

          ## 1. Pre-flight
          - Pull the exact GitHub `main` commit.
          - Build the web app with `npm.cmd run build`.
          - Restart `LaSereneHMSApi` after API changes.
          - Confirm `/api/ready` returns HTTP 200.
          - Confirm the latest PostgreSQL `.dump` backup exists before testing.

          ## 2. Guest master / search
          - Search by guest name, phone and email.
          - Verify the API never returns more than 20 default guest-search results.
          - Create a new guest with a unique phone/ID.
          - Attempt a duplicate phone or ID and verify the API returns HTTP 409 with matching guest information.
          - Edit a guest and verify the duplicate protection excludes the guest being edited.

          ## 3. Reservation lifecycle
          - Create a reservation for one room.
          - Create a multi-room reservation.
          - Verify active reservations are visible and checked-out/cancelled history is hidden by default.
          - Search historical reservations and confirm they remain discoverable.
          - Check in, add room/service charges, and verify the folio.

          ## 4. Payments and folio integrity
          - Record cash, card and bank-transfer payments on controlled test reservations.
          - Verify outstanding balance changes exactly by the payment amount.
          - Verify overpayment/invalid amounts are rejected.
          - Correct/reverse a charge and confirm the financial ledger remains balanced.
          - Close only when the authoritative folio total matches the financial ledger.

          ## 5. Expenses and physical cash
          - Post a cash expense and verify physical cash decreases by exactly that amount.
          - Post a bank/card expense and verify physical cash does not change.
          - Void an expense and verify the reversal is reflected without deleting audit history.

          ## 6. Consecutive business dates / night audit
          - Close a controlled business date with no open operational blockers.
          - Confirm the next business date opens automatically.
          - Before closing the next date, verify opening cash equals the prior day's physical closing cash.
          - Verify current cash receipts and current cash expenses affect only the current day's cash.
          - Verify trial balance, revenue reconciliation, payment reconciliation and cash difference are balanced.
          - Repeat for at least two consecutive business-date transitions.

          ## 7. Backup / restore
          - Create a fresh PostgreSQL `.dump` from the Backup screen.
          - Verify the backup is listed and downloadable.
          - Perform restore only against a safe/test database or controlled maintenance window.
          - Verify the application comes back healthy and key guest/reservation/folio records remain present.
          - Verify a pre-restore safety backup was created.

          ## 8. Role permissions
          - `admin`: full configuration, financial, backup/restore and user-authorized actions.
          - `reception`: guest/reservation/front-desk operational actions but no admin-only configuration/restore.
          - `housekeeping`: room/housekeeping status work without financial/admin actions.
          - For every forbidden action, verify both the UI and API reject it; do not rely on hidden buttons alone.

          ## 9. Current known real-world reconciliation case
          The historical 2026-09-15 Excel reconciliation must remain consistent:
          - Opening cash: PKR 45,176
          - Cash receipts: PKR 0
          - Expenses: PKR 28,950
          - Closing cash: PKR 16,226
          - Revenue: PKR 36,000
          - Pending/company receivable: PKR 36,000

          For the following business date, the carry-forward check previously established is:
          - Opening cash: PKR 16,226
          - Cash received: PKR 40,500
          - Expenses: PKR 0
          - Projected closing cash: PKR 56,726

          ## Pass criteria
          Any financial mismatch, unexpected duplicate guest creation, unauthorized API mutation, failed backup validation, or broken business-date carry-forward is a release blocker.
          EOF

      - name: Run API tests
        working-directory: apps/api
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v

      - name: Run frontend build
        working-directory: apps/web
        run: |
          npm install
          npm run build

      - name: Commit hardened guest API and QA checklist
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/harden-guest-and-qa.yml
          git add apps/api/app/main.py apps/api/tests/test_guest_profile.py docs/PRODUCTION-QA-CHECKLIST.md .github/workflows/harden-guest-and-qa.yml
          git commit -m "Harden guest search and duplicate protection" || exit 0
          git push origin main
