name: CI

on: [push, pull_request]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hms
          POSTGRES_PASSWORD: hms
          POSTGRES_DB: la_serene_hms_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hms -d la_serene_hms_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/api
    env:
      HMS_DATABASE_URL: postgresql+psycopg://hms:hms@127.0.0.1:5432/la_serene_hms_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -c "from app.main import app; print(app.title)"
      - run: alembic upgrade head
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s tests -p 'test_postgres_smoke.py' -v
      - run: HMS_DATABASE_URL=sqlite:///ci_phase0.sqlite3 alembic upgrade head

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
